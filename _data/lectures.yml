- section: Function Approximation
  lecture_number: 8
  date: Sep 24
  title: 'Classification II: Softmax, Metrics and a Hands-on Dataset'
  subtitle: The rest of logistic regression, many classes, and your first classification analysis
  type: lecture
  duration: 75
  description: 'Second half of the logistic regression deck: decision boundary geometry and margin, precision and recall, softmax regression for many classes. Then a short hands-on exercise: a dataset, a question, and your own analysis.

    '
  materials:
    preparation:
    - name: Bring a laptop with Python and scikit-learn working
      url: https://scikit-learn.org/stable/install.html
      type: references
    lecture:
    - name: Classification and Logistic Regression slides, from the two-feature boundary
      url: https://learn.sematlas.com/slides/intro_ml_06n#/higher-dim-inputs
      type: interactive
      visible: true
    - name: 'Hands-on starter notebook (fill in the cells): classification metrics lab'
      url: /materials/notebooks/classification_metrics_lab/
      type: notebook
      visible: true
    - name: 'Hands-on dataset: Breast Cancer Wisconsin (load_breast_cancer in scikit-learn)'
      url: https://scikit-learn.org/stable/modules/generated/sklearn.datasets.load_breast_cancer.html
      type: notebook
    references:
    - name: CS229 notes, Chapter 2 (classification and logistic regression, softmax regression)
      url: https://cs229.stanford.edu/main_notes.pdf
      type: references
    - name: scikit-learn, LogisticRegression (multi-class handled by the same class)
      url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      type: references
  references:
  assignments:
  preparation:
  - Reread the first half of the logistic regression deck up to the two-feature boundary; the session starts there
  - 'Have Python and scikit-learn running: the hands-on part is you fitting a classifier, not watching one'
  takeaways:
  - The decision boundary is where the score is zero; the margin is how far the closest point sits from it
  - Accuracy is the wrong compass when classes are imbalanced; report precision and recall at the threshold you deploy
  - Softmax regression is logistic regression with one score per class, normalised by the exponentials
  - 'Analysing a dataset means: look at it, pick a question, fit, hold out, and read the confusion matrix'
  study_guide:
  - Finish the hands-on analysis at home if you did not in class; compare accuracy, precision and recall on a held-out split
  - Derive the gradient of the cross-entropy loss yourself, then check it against the slide
  - Try the same dataset with sklearn's LogisticRegression and compare with your own gradient descent
