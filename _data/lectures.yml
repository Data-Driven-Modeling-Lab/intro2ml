  assignments:
  preparation:
  - 'Quiz 1 covers sessions 1 to 4: supervised vs unsupervised learning, linear models in vector form, the train/validation/test split'
  - Have Python and scikit-learn working on your machine; the video tutorial shows the setup
  takeaways:
  - In scikit-learn every model is fit, then predict; the feature engineering happens before fit
  - The held-out set is the only honest estimate of how a model will do on new data
  - 'Model choice is an experiment: compare validation error across candidates, do not guess'
  study_guide:
  - Redo the coding walkthrough from the slides in your own notebook, with a dataset of your choice
  - Watch the scikit-learn video tutorial, then try Module 1 of the Inria MOOC
  - Continue PS1 (due Sep 23)
