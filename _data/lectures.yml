  date: Sep 1
  title: Introduction and Logistics
  subtitle: Why build intelligent machines, a brief history of AI, and how this course works
  type: lecture
  duration: 75
  description: 'Course introduction covering learning objectives, expectations, and motivation.  Exploration of AI''s transformative impact on society and discussion of ethical  implications in AI development and deployment.

    '
  materials:
    preparation:
    - name: Pre-course Survey
      url: https://docs.google.com/forms/d/e/1FAIpQLSd01PzGEE1JxqCwxGWsXeS8goRgRcYOOR9sAuEW0UQBrTQmgA/viewform?usp=sharing&ouid=112491546008459452170
      type: references
      required: true
    - name: Course introductory note and takeaways
      url: /materials/references/course_purpose_note/
      type: references
    lecture:
    - name: Introduction and Logistics
      url: https://learn.sematlas.com/slides/intro_ml_01n#/start
      type: interactive
      visible: true
    references:
    - name: 'Artificial Intelligence: A Modern Approach (Ch. 1) Russell & Norvig textbook'
      url: https://api.pageplace.de/preview/DT0400.9781292401171_A41586057/preview-9781292401171_A41586057.pdf
      type: references
      chapter: Chapter 1 - Introduction
      recommended: true
    - name: A bit about my research - Discovering Physics with Machine Learning
      url: https://www.josephbakarji.com/articles/?slug=on-discovering-physics-from-data
      type: research
      optional: true
    - name: 2025 PDF slides
      url: /materials/slides/introductory_slides.pdf
      type: slides
    homework:
    - name: 'How will you use AI in this course?'
      url: https://learn.sematlas.com/slides/intro_ml_01n#/chat-how_you_will_use_ai
      type: conversation
      description: A conversation with the course tutor, on the last slide of lecture 1.
        Four turns minimum. Do it before lecture 2.
  references:
  assignments:
  week_note: /notes/week-01/
  takeaways:
  - A model is a compression of reality, kept only as far as it serves an action
  - Data are what the world gives you; the model is what you make of them
  - Learning lives in the loop between perception and action, not in either alone
  study_guide:
  - 'Before class: nothing, come curious'
  - 'After: reread the Introduction and Logistics slides, note one model you use daily'
  - Set up Python per the logistics page
  - Have the AI conversation on the last slide, before lecture 2
  - Start PS0 (posted today, due Sep 9)
